apiVersion: harness-rsi/v1alpha1
kind: ModelProviderAdapter

metadata:
  id: zcloud-anthropic
  name: ZCloud Anthropic-Compatible Gateway

spec:
  protocol: anthropic-messages
  credentials:
    baseUrlEnvironment: RSI_CLAUDE_PROVIDER_BASE_URL
    apiKeyEnvironment: RSI_CLAUDE_PROVIDER_API_KEY

  compatibility:
    supportsDeveloperRole: false
    maxTokensField: max_tokens

  defaultContextWindow: 200000
  models:
    - id: claude-haiku-4-5
      name: Claude Haiku 4.5
    - id: claude-haiku-4-5-20251001
      name: Claude Haiku 4.5 (2025-10-01)
    - id: claude-opus-4-5-20251101
      name: Claude Opus 4.5 (2025-11-01)
    - id: claude-opus-4-6
      name: Claude Opus 4.6
    - id: claude-opus-4-7
      name: Claude Opus 4.7
    - id: claude-opus-4-8
      name: Claude Opus 4.8
    - id: claude-opus-5
      name: Claude Opus 5
    - id: claude-sonnet-4-5-20250929
      name: Claude Sonnet 4.5 (2025-09-29)
    - id: claude-sonnet-4-6
      name: Claude Sonnet 4.6
    - id: claude-sonnet-5
      name: Claude Sonnet 5
