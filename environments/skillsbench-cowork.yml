apiVersion: harness-rsi/v1alpha1
kind: EnvironmentAdapter

metadata:
  id: skillsbench-cowork
  name: SkillsBench Cowork Docker Environment

spec:
  protocol: skillsbench-docker-v1

  source:
    rootEnvironment: RSI_SKILLSBENCH_ROOT
    tasksSubdirectory: tasks
    revision: bf3793e9ec20e9682e6f18dbf4de3c69163dc9c7

  task:
    instructionCandidates:
      - task.md
      - instruction.md
      - README.md
    dockerfile: environment/Dockerfile
    dockerContext: environment
    skillsDirectory: environment/skills
    workspacePath: /root
    workspaceLimits:
      maximumFiles: 10000
      maximumBytes: 1073741824
      maximumFileBytes: 536870912
      maximumChangedFiles: 2048
      maximumChangedBytes: 536870912
    verifierCandidates:
      - verifier/test.sh

  docker:
    binary: docker
    # 通用 Docker 默认网络；Solver/Updater 实际运行时由 Controller 强制覆盖为每个 Run 的 internal network。
    network: bridge
    runAsCurrentUser: true
    resources:
      cpus: 4
      memory: 8g
      pids: 512
      timeoutSeconds: 1200

  modelGateway:
    image: harness-rsi/model-gateway:v1
    dockerfile: docker/model-gateway/Dockerfile
    alias: model-gateway
    port: 8080
    egressNetwork: bridge
    maximumRequestsPerRun: 512
    maximumConcurrentRequests: 8
    resources:
      cpus: 1
      memory: 512m
      pids: 128

  verifier:
    pythonCommand: python
    shellCommand: bash
    arguments: []
    # 该白名单是 Verifier 继承宿主代理的唯一入口。当前 SkillsBench 使用 bridge 直连；
    # Controller 会把未列入白名单的标准代理变量显式传空，覆盖 Docker 客户端的隐式代理。
    proxyEnvironment: []
    # 可选本机工具缓存；未设置宿主变量时仍按上游脚本直连下载。
    dependencyEnvironment:
      UV_DOWNLOAD_URL: RSI_VERIFIER_UV_DOWNLOAD_URL
      PIP_INDEX_URL: RSI_VERIFIER_PYPI_INDEX_URL
      UV_INDEX_URL: RSI_VERIFIER_PYPI_INDEX_URL
    # Verifier 属于可信控制平面；部分 SkillsBench Verifier 会在首次运行时安装依赖。
    network: bridge
    # 真实 SkillsBench test.sh 需要 apt-get，因此 Verifier 单独以 root 运行；Solver/Updater 仍为普通用户。
    runAsCurrentUser: false
    outputCandidates:
      - /logs/verifier/reward.txt
    # pytest 启动成功后必然生成 CTRF；缺失说明依赖安装等评分基础设施失败，不能算作答题 0 分。
    requiredEvidenceCandidates:
      - /logs/verifier/ctrf.json
    maximumAttempts: 2

  reward:
    minimum: 0
    maximum: 1
    resolvedThreshold: 1

  feedback:
    maximumTextBytesPerCase: 12000
    maximumArtifactEntriesPerCase: 100
    maximumArtifactBytesPerCase: 32768
    maximumHistoryEntries: 10
    maximumHistoryBytes: 32768
