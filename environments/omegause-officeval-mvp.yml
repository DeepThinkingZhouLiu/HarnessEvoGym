apiVersion: harness-rsi/v1alpha1
kind: EnvironmentAdapter

metadata:
  id: omegause-officeval
  name: OmegaUse-OfficeVal Two-Task MVP Environment

spec:
  protocol: omegause-officeval-docker-v1

  source:
    datasetRootEnvironment: RSI_OFFICEVAL_DATASET_ROOT
    evaluatorRootEnvironment: RSI_OFFICEVAL_EVALUATOR_ROOT
    datasetRevision: cd6ba6d8fb83b3fb551e24eebc20e1fb0bd154a5
    evaluatorRevision: ffbeecb8752447c8e40b594a0eeb1db7236ecb36
    manifestPath: benchmarks/omegause-officeval/source-manifest.json
    manifestDigest: 8bf749b53988822a90520eba4761c6c311e17dd0e13bd78658b261a921128291

  task:
    workspacePath: /workspace
    environmentAssets: environments/omegause-officeval-assets
    # 单 Branch 内串行执行两道题；多 Branch 仍可同步并行。
    maximumConcurrentTrials: 1
    workspaceLimits:
      maximumFiles: 10000
      maximumBytes: 1073741824
      maximumFileBytes: 536870912
      maximumChangedFiles: 2048
      maximumChangedBytes: 536870912

  runtime:
    image: harness-rsi/omegause-officeval:v1
    dockerfile: docker/omegause-officeval/Dockerfile
    verifierRunner: docker/omegause-officeval/run-verifier.py

  docker:
    binary: docker
    network: bridge
    runAsCurrentUser: true
    resources:
      cpus: 4
      memory: 8g
      pids: 512
      timeoutSeconds: 3600

  modelGateway:
    image: harness-rsi/model-gateway:v1
    dockerfile: docker/model-gateway/Dockerfile
    alias: model-gateway
    port: 8080
    egressNetwork: bridge
    maximumRequestsPerRun: 64
    maximumConcurrentRequests: 4
    maximumUpstreamRetries: 5
    resources:
      cpus: 1
      memory: 512m
      pids: 128

  verifier:
    timeoutSeconds: 300
    resources:
      cpus: 2
      memory: 4g
      pids: 256

  reward:
    minimum: 0
    maximum: 1
    resolvedThreshold: 1

  feedback:
    maximumTextBytesPerCase: 32768
    maximumArtifactEntriesPerCase: 200
    maximumArtifactBytesPerCase: 65536
    maximumHistoryEntries: 10
    maximumHistoryBytes: 131072
