apiVersion: harness-rsi/v1alpha1
kind: EvolutionRecipe
spec:
  population:
    mode: single
    concurrency: { n_branches: 1 }
    budget: { total_budget: 16, beta: 0 }
    peer_sharing: { enabled: false }
    competition: { enabled: false }
  moduleSearch:
    authority: strategy-directed
    riskCeiling: l3
    strategy: linear-hill-climb
  checkpointing:
    budgetMilestones: [0, 2, 4, 6, 8, 10, 12, 16]
    branchGenerationMilestones: [2, 4, 6, 8, 10, 12, 16]
    capture: { populationBest: true, branchIncumbents: true, latestAttempts: true }
