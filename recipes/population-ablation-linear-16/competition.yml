apiVersion: harness-rsi/v1alpha1
kind: EvolutionRecipe
spec:
  population:
    mode: competition
    concurrency: { n_branches: 2 }
    budget: { total_budget: 16, beta: 0.5 }
    peer_sharing: { enabled: false }
    competition: { enabled: true, bonus_grant_unit: 1 }
  moduleSearch:
    authority: strategy-directed
    riskCeiling: l2
    strategy: linear-hill-climb
  checkpointing:
    budgetMilestones: [0, 4, 8, 12, 16]
    capture:
      populationBest: true
      branchIncumbents: true
      latestAttempts: true
